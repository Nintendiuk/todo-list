{% extends "base.html" %}
{% block title %}{{ form_title }}{% endblock %}

{% block content %}
<div class="page-header">
  <h2 class="page-title"><span>{{ form_title }}</span></h2>
</div>

<div class="form-card">
  <form method="post" novalidate>
    {% csrf_token %}

    <div class="form-group">
      <label class="form-label" for="{{ form.name.id_for_label }}">
        {{ form.name.label }}
      </label>
      {{ form.name }}
      {% if form.name.errors %}
        <ul class="errorlist">
          {% for error in form.name.errors %}<li>{{ error }}</li>{% endfor %}
        </ul>
      {% endif %}
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary">{{ submit_label }}</button>
      <a href="{% url 'tasks:tag-list' %}" class="btn btn-outline">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
